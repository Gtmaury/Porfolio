name: Fetch Beauty Room index
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fetch-beauty-room-index.yml'
jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download index.html
        run: |
          curl -fsSL "https://litter.catbox.moe/jipn5n.html" -o index.html
          grep -q 'serena-curso.jpg' index.html
          grep -q 'style.css?v=40.0' index.html
          grep -q '<!DOCTYPE html>' index.html
          test $(wc -c < index.html) -gt 20000
      - name: Commit index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Restore full index.html: Beauty Room jpg preview + CSS v40.0"
          git push
